name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (Rust/Axum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        working-directory: api
        run: |
          RC=0
          cargo check --all-targets > /tmp/api_check.log 2>&1 || RC=$?
          {
            echo "### cargo check (api) — exit $RC"
            echo '```'
            tail -n 300 /tmp/api_check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$RC" -eq 0

  sdk-js:
    name: SDK JavaScript/TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: sdk/js
        run: npm install
      - working-directory: sdk/js
        run: npx tsc --noEmit

  sdk-python:
    name: SDK Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile sdk/python/secure_auth/__init__.py tests/python/test_sdk.py

  sdk-rust:
    name: SDK Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        working-directory: sdk/rust
        run: |
          RC=0
          cargo check --all-targets > /tmp/sdk_check.log 2>&1 || RC=$?
          {
            echo "### cargo check (sdk/rust) — exit $RC"
            echo '```'
            tail -n 200 /tmp/sdk_check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$RC" -eq 0
      - name: cargo test
        working-directory: sdk/rust
        run: |
          RC=0
          cargo test > /tmp/sdk_test.log 2>&1 || RC=$?
          {
            echo "### cargo test (sdk/rust) — exit $RC"
            echo '```'
            tail -n 150 /tmp/sdk_test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$RC" -eq 0

  sdk-csharp:
    name: SDK C#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - working-directory: sdk/csharp/SecureAuth
        run: dotnet build -c Release
