name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  api:
    name: API (Rust/Axum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        working-directory: api
        run: |
          RC=0
          cargo check --all-targets > /tmp/api_check.log 2>&1 || RC=$?
          cp /tmp/api_check.log "$GITHUB_WORKSPACE/ci-api.log"
          echo "RC=$RC" >> "$GITHUB_ENV"
      - name: publish error log
        if: failure() && env.RC != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="ci-api.log"
          CONTENT=$(base64 -w0 < "$GITHUB_WORKSPACE/$FILE")
          SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/$FILE?ref=main" | jq -r '.sha // empty')
          jq -n --arg msg "ci: api log [skip ci]" --arg c "$CONTENT" --arg sha "$SHA" \
            '{message:$msg, content:$c, branch:"main",
              committer:{name:"ci-bot", email:"ci@bot.local"}, sha:$sha}' > payload.json
          curl -s -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "https://api.github.com/repos/${{ github.repository }}/contents/$FILE" >/dev/null

  sdk-js:
    name: SDK JavaScript/TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: sdk/js
        run: npm install
      - working-directory: sdk/js
        run: npx tsc --noEmit

  sdk-python:
    name: SDK Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile sdk/python/secure_auth/__init__.py tests/python/test_sdk.py

  sdk-rust:
    name: SDK Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check + test
        working-directory: sdk/rust
        run: |
          RC=0
          cargo check --all-targets > /tmp/sdk_check.log 2>&1 || RC=$?
          cargo test           > /tmp/sdk_test.log 2>&1 || RC=$?
          cat /tmp/sdk_check.log /tmp/sdk_test.log > "$GITHUB_WORKSPACE/ci-sdk-rust.log"
          echo "RC=$RC" >> "$GITHUB_ENV"
      - name: publish error log
        if: failure() && env.RC != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="ci-sdk-rust.log"
          CONTENT=$(base64 -w0 < "$GITHUB_WORKSPACE/$FILE")
          SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/$FILE?ref=main" | jq -r '.sha // empty')
          jq -n --arg msg "ci: sdk rust log [skip ci]" --arg c "$CONTENT" --arg sha "$SHA" \
            '{message:$msg, content:$c, branch:"main",
              committer:{name:"ci-bot", email:"ci@bot.local"}, sha:$sha}' > payload.json
          curl -s -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "https://api.github.com/repos/${{ github.repository }}/contents/$FILE" >/dev/null

  sdk-csharp:
    name: SDK C#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - working-directory: sdk/csharp/SecureAuth
        run: dotnet build -c Release
