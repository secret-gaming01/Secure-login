[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-login-sdk"
version = "1.0.0"
description = "Official Python SDK for Secure-Login authentication API"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["auth", "security", "mfa", "passkeys", "jwt"]

[project.urls]
Homepage = "https://github.com/secret-gaming01/Secure-login"

[tool.setuptools.packages.find]
include = ["secure_auth*"]
