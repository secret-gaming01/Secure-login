[package]
name = "secure-login-sdk"
version = "1.0.0"
edition = "2021"
description = "Official Rust SDK for Secure-Login authentication API"
license = "MIT"

[dependencies]
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
