[package]
name = "secure-auth-api"
version = "1.0.0"
edition = "2021"
description = "Ultra-secure universal authentication system (Axum + SQLx, PostgreSQL/SQLite)"
license = "MIT"

[features]
default = ["webauthn", "redis-store"]
# Passkeys/WebAuthn (tire compact_jwt -> OpenSSL natif ; desactivable pour des
# builds sans dependances C : cargo check/build --no-default-features)
webauthn = ["dep:webauthn-rs"]
# Store partage Redis (rate-limit multi-instance + etats WebAuthn)
redis-store = ["dep:redis"]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "limit"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.7", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "sqlite",
    "chrono",
    "uuid",
    "migrate",
] }

argon2 = "0.5"
jsonwebtoken = "9"
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "hostname",
    "smtp-transport",
    "rustls-tls",
] }
qrcodegen = "1"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

aes-gcm = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.21"

webauthn-rs = { version = "0.4", optional = true }
url = "2"

reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
redis = { version = "0.25", optional = true, default-features = false, features = ["tokio-comp"] }

thiserror = "1"
anyhow = "1"
dotenvy = "0.15"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
